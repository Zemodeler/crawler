name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Install crawler dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Study Hub dependencies
        run: corepack pnpm --dir hub install --frozen-lockfile
      - name: Typecheck, test, lint and build
        run: corepack pnpm check
